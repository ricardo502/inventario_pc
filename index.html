<!DOCTYPE html>
  <html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script>
          if (window.location.protocol === 'file:') {
              window.location.replace('http://localhost/inventario_pc/');
          }
      </script>
      <title>Inventario de Cómputo</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

  <div class="container mt-5">
      <h2 class="text-center mb-4">Inventario de Equipo de Cómputo</h2>

      <!-- Formulario -->
      <div class="card mb-4 shadow-sm">
          <div class="card-body">
              <form id="formEquipo" class="row g-3">
                  <input type="hidden" id="equipoId">

                  <div class="col-md-3">
                      <label class="form-label">Nombre del Equipo</label>
                      <input type="text" id="nombre" class="form-control" placeholder="Ej. Laptop HP" required>
                  </div>
                  <div class="col-md-3">
                      <label class="form-label">Categoría</label>
                      <select id="categoria" class="form-select" required>
                          <option value="Laptops">Laptops</option>
                          <option value="PC Escritorio">PC Escritorio</option>
                          <option value="Monitores">Monitores</option>
                          <option value="Componentes">Componentes</option>
                          <option value="Periféricos">Periféricos</option>
                      </select>
                  </div>
                  <div class="col-md-2">
                      <label class="form-label">Precio ($)</label>
                      <input type="number" step="0.01" id="precio" class="form-control" required>
                  </div>
                  <div class="col-md-2">
                      <label class="form-label">Stock</label>
                      <input type="number" id="stock" class="form-control" required>
                  </div>
                  <div class="col-md-2 d-flex align-items-end">
                      <button type="submit" id="btnGuardar" class="btn btn-primary w-100 text-nowrap">Guardar</button>
                  </div>
              </form>
          </div>
      </div>

      <!-- Tabla de resultados -->
      <div class="card shadow-sm">
          <div class="card-body">
              <table class="table table-hover align-middle">
                  <thead class="table-dark">
                      <tr>
                          <th>ID</th>
                          <th>Equipo</th>
                          <th>Categoría</th>
                          <th>Precio</th>
                          <th>Stock</th>
                          <th>Acciones</th>
                      </tr>
                  </thead>
                  <tbody id="tablaEquipos">
                      <!-- Los datos se cargarán aquí con JS -->
                  </tbody>
              </table>
          </div>
      </div>
  </div>

  <script src="app.js"></script>
  
    </body>
  </html>
